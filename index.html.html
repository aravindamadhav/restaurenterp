<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saffron Table ERP — Restaurant Operations</title>
<style>
:root{--bg:#f1f4f0;--card:#fff;--ink:#18231d;--mute:#667568;--line:#dde4dc;--side:#1c2a22;--sideink:#c9d6cc;--acc:#e0a21b;--ok:#2f8f5b;--bad:#c4452d;--info:#2c6fa8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121a15;--card:#1b261f;--ink:#e8efe9;--mute:#93a496;--line:#2b3a30;--side:#0e1511}}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 Manrope,"Segoe UI",system-ui,sans-serif;display:flex}
aside{width:210px;background:var(--side);color:var(--sideink);padding:16px 10px;flex-shrink:0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
.brand{font-weight:800;font-size:17px;color:#fff;padding:4px 10px 14px}.brand small{display:block;font-weight:500;font-size:11px;color:var(--acc)}
aside a{padding:9px 12px;border-radius:8px;cursor:pointer;color:inherit;text-decoration:none;display:block}
aside a.on{background:rgba(224,162,27,.18);color:#fff;border-left:3px solid var(--acc)}
main{flex:1;min-width:0;padding:18px 22px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
h1{font-size:21px;margin:0}h2{font-size:15px;margin:0 0 10px}
.grid{display:grid;gap:12px}.k4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.c2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi b{display:block;font-size:22px}.kpi span{color:var(--mute);font-size:12px}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mute);font-weight:600;font-size:12px}
button,select,input{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:#1c1500;font-weight:700}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.modes{display:flex;gap:6px;flex-wrap:wrap}.modes button.on{background:var(--side);color:#fff;border-color:var(--side)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--line)}
.tag.ok{background:#d5eedf;color:#1d6a41}.tag.bad{background:#f7d9d2;color:#9c2d19}.tag.warn{background:#faebc2;color:#7a5600}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;min-width:90px}.bar i{display:block;height:100%;background:var(--ok)}.bar i.low{background:var(--bad)}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.menu button{text-align:left;padding:10px}.menu small{display:block;color:var(--mute)}
.line{display:flex;justify-content:space-between;gap:8px;padding:4px 0;align-items:center}
.kds{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:10px;overflow-x:auto}.kds .col{background:var(--bg);border-radius:10px;padding:8px;min-height:160px}
.tk{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:8px;padding:9px;margin-bottom:8px;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--side);color:#fff;padding:10px 14px;border-radius:8px;display:none}
@media(max-width:760px){body{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:8px}.brand{display:none}aside a{white-space:nowrap}main{padding:14px}}
</style></head><body>
<aside id="nav"></aside>
<main><header><h1 id="ttl"></h1><div class="row" id="hdr"></div></header><div id="view"></div></main>
<div id="toast"></div>
<script>
const R=v=>"₹"+Math.round(v).toLocaleString("en-IN");
const ING={rice:{n:"Basmati rice",u:"kg",q:40,par:20,c:90},chk:{n:"Chicken",u:"kg",q:22,par:15,c:240},pnr:{n:"Paneer",u:"kg",q:11,par:8,c:320},oil:{n:"Cooking oil",u:"L",q:30,par:15,c:130},veg:{n:"Vegetables",u:"kg",q:35,par:20,c:50},flr:{n:"Wheat flour",u:"kg",q:30,par:15,c:45},chs:{n:"Cheese",u:"kg",q:7,par:5,c:420},spc:{n:"Spice mix",u:"kg",q:6,par:3,c:600}};
const MENU=[{id:1,n:"Chicken biryani",cat:"Mains",p:320,r:{rice:.2,chk:.18,oil:.03,spc:.02}},{id:2,n:"Paneer butter masala",cat:"Mains",p:280,r:{pnr:.15,oil:.03,spc:.015}},{id:3,n:"Veg thali",cat:"Mains",p:240,r:{rice:.12,veg:.2,flr:.08,oil:.02}},{id:4,n:"Butter naan",cat:"Breads",p:50,r:{flr:.1,oil:.01}},{id:5,n:"Cheese pizza",cat:"Mains",p:360,r:{flr:.2,chs:.12,veg:.05}},{id:6,n:"Veg fried rice",cat:"Mains",p:200,r:{rice:.18,veg:.15,oil:.03}},{id:7,n:"Chicken tikka",cat:"Starters",p:290,r:{chk:.2,spc:.02,oil:.02}},{id:8,n:"Paneer tikka",cat:"Starters",p:260,r:{pnr:.18,spc:.02,oil:.02}}];
const MODES={dine:{n:"Dine-in",svc:.10,fee:0},take:{n:"Takeaway",svc:0,fee:0},del:{n:"Delivery",svc:0,fee:40},cater:{n:"Catering",svc:.05,fee:0}};
const S={pg:"dash",mode:"dine",table:"T1",cart:{},orders:[],pos:[],staff:[{n:"Arjun",role:"Head chef",sh:"Morning",on:true},{n:"Meera",role:"Captain",sh:"Evening",on:true},{n:"Ravi",role:"Line cook",sh:"Morning",on:false},{n:"Sana",role:"Cashier",sh:"Evening",on:false}],seq:1000,po:900,role:"Owner",disc:0,pay:"UPI",cn:"",caps:[2,2,4,4,4,6,6,8],res:[{n:"Kapoor family",t:"20:00",party:5,table:"T7"}],cust:[{n:"Anita Rao",v:14,spend:6200,pts:620},{n:"Vikram Shah",v:4,spend:1400,pts:140},{n:"Priya Nair",v:27,spend:11200,pts:1120}],waste:[]};
const cost=m=>Object.entries(m.r).reduce((a,[k,v])=>a+v*ING[k].c,0);
function price(cart,mode){const M=MODES[mode];let sub=0;for(const id in cart)sub+=MENU.find(m=>m.id==id).p*cart[id];const dc=sub*S.disc/100,svc=(sub-dc)*M.svc,gst=(sub-dc+svc)*.05,fee=sub?M.fee:0;return{sub,dc,svc,gst,fee,total:sub-dc+svc+gst+fee}}
function seed(){[["dine",{1:2,4:4}],["take",{3:2}],["del",{5:1,6:1}],["cater",{1:20,4:40}],["dine",{2:1,7:1}]].forEach(([m,c],i)=>{const o=mk(m,c,"T"+(i+2),true);o.status=["Served","Served","Ready","Cooking","New"][i]})}
function mk(mode,cart,table,quiet){const p=price(cart,mode),items=Object.entries(cart).map(([id,q])=>({id:+id,q}));let cg=0;items.forEach(i=>{const m=MENU.find(x=>x.id==i.id);cg+=cost(m)*i.q;if(!quiet)for(const k in m.r)ING[k].q=Math.max(0,+(ING[k].q-m.r[k]*i.q).toFixed(2))});const o={id:++S.seq,mode,table:mode=="dine"?table:"—",items,...p,cogs:cg,status:"New",pay:S.pay,cn:S.cn,t:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})};S.orders.unshift(o);return o}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display="none",1800)}
const PG={dash:"Dashboard",pos:"Point of sale",kds:"Kitchen display",inv:"Inventory",rec:"Recipes and costing",pur:"Purchasing",staff:"Staff",fin:"Finance",tbl:"Floor and bookings",crm:"Customers",rpt:"Menu engineering",wst:"Wastage"};
const tag=(t,c)=>`<span class="tag ${c||""}">${t}</span>`;
const rev=()=>S.orders.reduce((a,o)=>a+o.total,0);
function dash(){const o=S.orders,r=rev(),cg=o.reduce((a,x)=>a+x.cogs,0),low=Object.values(ING).filter(i=>i.q<i.par);
const byM=Object.keys(MODES).map(k=>({k,v:o.filter(x=>x.mode==k).reduce((a,x)=>a+x.total,0)})),mx=Math.max(1,...byM.map(x=>x.v));
return `<div class="grid k4">${[["Revenue today",R(r)],["Orders",o.length],["Avg order",R(r/(o.length||1))],["Food cost %",(cg/(r||1)*100).toFixed(0)+"%"],["Low stock items",low.length]].map(([a,b])=>`<div class="card kpi"><span>${a}</span><b>${b}</b></div>`).join("")}</div>
<div class="grid c2" style="margin-top:12px"><div class="card"><h2>Revenue by service mode</h2>${byM.map(x=>`<div class="line"><span style="width:90px">${MODES[x.k].n}</span><div class="bar" style="flex:1"><i style="width:${x.v/mx*100}%"></i></div><b>${R(x.v)}</b></div>`).join("")}</div>
<div class="card"><h2>Needs reordering</h2>${low.map(i=>`<div class="line"><span>${i.n}</span>${tag(i.q+" "+i.u+" left","bad")}</div>`).join("")||"Everything is above par level."}</div>
<div class="card"><h2>Live tickets</h2>${o.filter(x=>x.status!="Served").map(x=>`<div class="line"><span>#${x.id} ${MODES[x.mode].n} ${x.table}</span>${tag(x.status,x.status=="Ready"?"ok":"warn")}</div>`).join("")||"No open tickets."}</div></div>`}
function pos(){const c=S.cart,p=price(c,S.mode),M=MODES[S.mode];
return `<div class="modes" style="margin-bottom:12px">${Object.keys(MODES).map(k=>`<button class="${k==S.mode?"on":""}" onclick="S.mode='${k}';go()">${MODES[k].n}</button>`).join("")}${S.mode=="dine"?`<select onchange="S.table=this.value">${["T1","T2","T3","T4","T5","T6"].map(t=>`<option ${t==S.table?"selected":""}>${t}</option>`).join("")}</select>`:""}</div>
<div class="row" style="margin-bottom:12px"><select aria-label="Customer" onchange="setC(this.value)"><option value="">Walk-in guest</option>${S.cust.map(c=>`<option ${c.n==S.cn?"selected":""}>${c.n}</option>`).join("")}</select><select aria-label="Discount" onchange="S.disc=+this.value;go()">${[0,5,10,15].map(d=>`<option value="${d}" ${d==S.disc?"selected":""}>Discount ${d}%</option>`).join("")}</select><select aria-label="Payment" onchange="S.pay=this.value">${["UPI","Card","Cash","Split"].map(m=>`<option ${m==S.pay?"selected":""}>${m}</option>`).join("")}</select></div><div class="grid c2"><div class="card"><h2>Menu</h2><div class="menu">${MENU.map(m=>`<button onclick="add(${m.id},${S.mode=="cater"?10:1})">${m.n}<small>${R(m.p)} · ${m.cat}</small></button>`).join("")}</div>${S.mode=="cater"?`<p style="color:var(--mute)">Catering adds items in batches of 10 portions.</p>`:""}</div>
<div class="card"><h2>${M.n} order</h2>${Object.keys(c).map(id=>{const m=MENU.find(x=>x.id==id);return `<div class="line"><span>${m.n}</span><span class="row"><button onclick="add(${id},-${S.mode=="cater"?10:1})">−</button>${c[id]}<button onclick="add(${id},${S.mode=="cater"?10:1})">+</button></span><b>${R(m.p*c[id])}</b></div>`}).join("")||"Add items from the menu."}
<hr style="border:0;border-top:1px solid var(--line)"><div class="line"><span>Subtotal</span>${R(p.sub)}</div>${p.dc?`<div class="line"><span>Discount ${S.disc}%</span>−${R(p.dc)}</div>`:""}${M.svc?`<div class="line"><span>Service charge ${M.svc*100}%</span>${R(p.svc)}</div>`:""}<div class="line"><span>GST 5%</span>${R(p.gst)}</div>${p.fee?`<div class="line"><span>Delivery fee</span>${R(p.fee)}</div>`:""}<div class="line"><b>Total</b><b>${R(p.total)}</b></div>${S.mode=="cater"&&p.sub?`<div class="line"><span>Advance due (30%)</span><b>${R(p.total*.3)}</b></div>`:""}
<button class="p" style="width:100%;margin-top:8px" onclick="place()" ${p.sub?"":"disabled"}>Send to kitchen</button></div></div>`}
function add(id,d){const c=S.cart;c[id]=(c[id]||0)+d;if(c[id]<=0)delete c[id];go()}
function place(){const o=mk(S.mode,S.cart,S.table),c=S.cust.find(x=>x.n==S.cn);if(c){c.v++;c.spend+=o.total;c.pts+=Math.floor(o.total/10)}S.cart={};S.disc=0;S.cn="";S.pg="kds";go();toast("Order #"+o.id+" sent to kitchen")}
function kds(){const st=["New","Cooking","Ready","Served"];return `<p style="color:var(--mute);margin-top:0">Select a ticket to move it to the next stage.</p><div class="kds">${st.map(s=>`<div class="col"><h2>${s} ${tag(S.orders.filter(o=>o.status==s).length)}</h2>${S.orders.filter(o=>o.status==s).map(o=>`<div class="tk" onclick="adv(${o.id})"><b>#${o.id} · ${MODES[o.mode].n} ${o.table}</b><div style="color:var(--mute)">${o.t}</div>${o.items.map(i=>`<div>${i.q}× ${MENU.find(m=>m.id==i.id).n}</div>`).join("")}</div>`).join("")}</div>`).join("")}</div>`}
function adv(id){const o=S.orders.find(x=>x.id==id),st=["New","Cooking","Ready","Served"],i=st.indexOf(o.status);if(i<3)o.status=st[i+1];go()}
function inv(){return `<div class="card scroll"><table><tr><th>Item</th><th>Stock</th><th>Level</th><th>Par</th><th>Cost/unit</th><th>Status</th><th></th></tr>${Object.entries(ING).map(([k,i])=>`<tr><td>${i.n}</td><td>${i.q} ${i.u}</td><td><div class="bar"><i class="${i.q<i.par?"low":""}" style="width:${Math.min(100,i.q/(i.par*2)*100)}%"></i></div></td><td>${i.par}</td><td>${R(i.c)}</td><td>${i.q<i.par?tag("Reorder","bad"):tag("OK","ok")}</td><td><button onclick="po('${k}')">Raise PO</button></td></tr>`).join("")}</table></div>`}
function po(k){const i=ING[k];S.pos.unshift({id:++S.po,k,q:i.par*2,status:"Ordered"});toast("Purchase order #"+S.po+" raised");go()}
function rec(){return `<div class="card scroll"><table><tr><th>Dish</th><th>Ingredients</th><th>Cost</th><th>Price</th><th>Margin</th></tr>${MENU.map(m=>{const c=cost(m),g=(m.p-c)/m.p*100;return `<tr><td>${m.n}</td><td style="white-space:normal">${Object.entries(m.r).map(([k,v])=>ING[k].n+" "+v+ING[k].u).join(", ")}</td><td>${R(c)}</td><td>${R(m.p)}</td><td>${tag(g.toFixed(0)+"%",g>60?"ok":g>45?"warn":"bad")}</td></tr>`}).join("")}</table></div>`}
function pur(){return `<div class="card scroll"><table><tr><th>PO</th><th>Item</th><th>Quantity</th><th>Value</th><th>Status</th><th></th></tr>${S.pos.map(p=>`<tr><td>#${p.id}</td><td>${ING[p.k].n}</td><td>${p.q} ${ING[p.k].u}</td><td>${R(p.q*ING[p.k].c)}</td><td>${tag(p.status,p.status=="Received"?"ok":"warn")}</td><td>${p.status=="Ordered"?`<button onclick="rcv(${p.id})">Receive stock</button>`:""}</td></tr>`).join("")||`<tr><td colspan=6>No purchase orders yet. Raise one from Inventory.</td></tr>`}</table></div>`}
function rcv(id){const p=S.pos.find(x=>x.id==id);p.status="Received";ING[p.k].q+=p.q;go()}
function staff(){return `<div class="card scroll"><table><tr><th>Name</th><th>Role</th><th>Shift</th><th>Status</th><th></th></tr>${S.staff.map((s,i)=>`<tr><td>${s.n}</td><td>${s.role}</td><td>${s.sh}</td><td>${tag(s.on?"On duty":"Off duty",s.on?"ok":"")}</td><td><button onclick="S.staff[${i}].on=!S.staff[${i}].on;go()">${s.on?"Clock out":"Clock in"}</button></td></tr>`).join("")}</table></div>`}
function fin(){const o=S.orders,r=rev(),cg=o.reduce((a,x)=>a+x.cogs,0),tax=o.reduce((a,x)=>a+x.gst,0),sv=o.reduce((a,x)=>a+x.svc,0),fee=o.reduce((a,x)=>a+x.fee,0);
return `<div class="grid c2"><div class="card"><h2>Profit summary</h2>${[["Gross sales",r],["GST collected",-tax],["Net sales",r-tax],["Cost of goods",-cg],["Gross profit",r-tax-cg]].map(([a,b])=>`<div class="line"><span>${a}</span><b>${R(b)}</b></div>`).join("")}</div>
<div class="card"><h2>Charges by mode</h2><div class="line"><span>Service charge (dine-in, catering)</span>${R(sv)}</div><div class="line"><span>Delivery fees</span>${R(fee)}</div><div class="line"><span>Catering advances held (30%)</span>${R(o.filter(x=>x.mode=="cater").reduce((a,x)=>a+x.total*.3,0))}</div></div></div>
<div class="card scroll" style="margin-top:12px"><h2>Order ledger</h2><table><tr><th>Order</th><th>Mode</th><th>Table</th><th>Subtotal</th><th>Total</th><th>Status</th></tr>${o.map(x=>`<tr><td>#${x.id}</td><td>${MODES[x.mode].n}</td><td>${x.table}</td><td>${R(x.sub)}</td><td>${R(x.total)}</td><td>${tag(x.status)}</td></tr>`).join("")}</table></div>`}
const ACC={Owner:Object.keys(PG),Manager:["dash","pos","kds","inv","rec","pur","staff","tbl","crm","rpt","wst"],Cashier:["pos","kds","tbl","crm"],Chef:["kds","inv","rec","wst"]};
const rsel=()=>`<select aria-label="Role" onchange="S.role=this.value;go()">${Object.keys(ACC).map(r=>`<option ${r==S.role?"selected":""}>${r}</option>`).join("")}</select>`;
function setC(n){S.cn=n;const c=S.cust.find(x=>x.n==n);if(c&&c.pts>=1000){S.disc=5;toast("Gold tier: 5% discount applied")}go()}
function tst(t){return S.orders.some(o=>o.mode=="dine"&&o.table==t&&o.status!="Served")?"Occupied":S.res.some(r=>r.table==t)?"Reserved":"Free"}
function tbl(){const cl={Free:"ok",Occupied:"bad",Reserved:"warn"};return `<div class="grid c2"><div class="card"><h2>Floor map</h2><div class="menu">${S.caps.map((c,i)=>{const t="T"+(i+1),s=tst(t);return `<button onclick="S.table='${t}';S.mode='dine';S.pg='pos';go()"><b>${t}</b> ${tag(s,cl[s])}<small>Seats ${c}</small></button>`}).join("")}</div><p style="color:var(--mute)">Select a table to start a dine-in order.</p></div><div class="card"><h2>Reservations</h2>${S.res.map((r,i)=>`<div class="line"><span>${r.t} · ${r.n} (${r.party}) · ${r.table}</span><button onclick="S.res.splice(${i},1);go()">Cancel</button></div>`).join("")||"No bookings."}<div class="row" style="margin-top:8px"><input id="rn" placeholder="Guest name" style="width:120px"><input id="rt" type="time" value="20:00"><input id="rp" type="number" value="2" min="1" style="width:60px"><button class="p" onclick="book()">Book</button></div></div></div>`}
function book(){const p=+rp.value,n=rn.value.trim(),i=S.caps.findIndex((c,j)=>c>=p&&tst("T"+(j+1))=="Free");if(!n||i<0)return toast(n?"No free table for "+p:"Enter a guest name");S.res.push({n,t:rt.value,party:p,table:"T"+(i+1)});go()}
const tier=p=>p>=1000?["Gold","warn"]:p>=500?["Silver",""]:["Bronze",""];
function crm(){return `<div class="card scroll"><table><tr><th>Customer</th><th>Visits</th><th>Spend</th><th>Points</th><th>Tier</th></tr>${S.cust.map(c=>{const t=tier(c.pts);return `<tr><td>${c.n}</td><td>${c.v}</td><td>${R(c.spend)}</td><td>${c.pts}</td><td>${tag(t[0],t[1])}</td></tr>`}).join("")}</table><p style="color:var(--mute)">Guests earn 1 point per ₹10. Gold (1,000 points) gets 5% off automatically in POS.</p><div class="row"><input id="cn" placeholder="New customer name"><button class="p" onclick="if(cn.value.trim()){S.cust.push({n:cn.value.trim(),v:0,spend:0,pts:0});go()}">Add customer</button></div></div>`}
function rpt(){const q={};S.orders.forEach(o=>o.items.forEach(i=>q[i.id]=(q[i.id]||0)+i.q));const rows=MENU.map(m=>({m,q:q[m.id]||0,g:m.p-cost(m)})),aq=rows.reduce((a,x)=>a+x.q,0)/rows.length,ag=rows.reduce((a,x)=>a+x.g,0)/rows.length,mx=Math.max(1,...rows.map(x=>x.q)),cls=x=>x.q>=aq?(x.g>=ag?["Star","ok"]:["Plowhorse","warn"]):(x.g>=ag?["Puzzle","warn"]:["Dog","bad"]);return `<div class="card scroll"><table><tr><th>Dish</th><th>Sold</th><th></th><th>Profit per plate</th><th>Class</th></tr>${rows.map(x=>{const c=cls(x);return `<tr><td>${x.m.n}</td><td>${x.q}</td><td><div class="bar"><i style="width:${x.q/mx*100}%"></i></div></td><td>${R(x.g)}</td><td>${tag(c[0],c[1])}</td></tr>`}).join("")}</table><p style="color:var(--mute)">Stars sell and earn well. Plowhorses sell well but earn less: review price or portion. Puzzles earn well but sell slowly: promote them. Dogs do neither: consider removing them.</p></div>`}
function wst(){const tot=S.waste.reduce((a,w)=>a+w.v,0);return `<div class="grid c2"><div class="card"><h2>Log wastage</h2><div class="row"><select id="wi">${Object.entries(ING).map(([k,i])=>`<option value="${k}">${i.n}</option>`).join("")}</select><input id="wq" type="number" step="0.1" min="0.1" value="1" style="width:70px"><select id="wr"><option>Spoiled</option><option>Overcooked</option><option>Spilled</option><option>Returned</option></select><button class="p" onclick="wlog()">Record</button></div><p>Total loss: <b>${R(tot)}</b></p></div><div class="card scroll"><h2>Wastage log</h2><table><tr><th>Item</th><th>Qty</th><th>Reason</th><th>Loss</th></tr>${S.waste.map(w=>`<tr><td>${ING[w.k].n}</td><td>${w.q} ${ING[w.k].u}</td><td>${w.r}</td><td>${R(w.v)}</td></tr>`).join("")||"<tr><td colspan=4>Nothing logged.</td></tr>"}</table></div></div>`}
function wlog(){const k=wi.value,q=Math.min(+wq.value||0,ING[k].q);if(q<=0)return toast("Not enough stock");ING[k].q=+(ING[k].q-q).toFixed(2);S.waste.unshift({k,q,r:wr.value,v:q*ING[k].c});go()}
const V={dash,pos,kds,inv,rec,pur,staff,fin,tbl,crm,rpt,wst};
function go(){if(!ACC[S.role].includes(S.pg))S.pg=ACC[S.role][0];document.getElementById("nav").innerHTML=`<div class="brand">Saffron Table<small>Restaurant ERP</small></div>`+Object.entries(PG).filter(([k])=>ACC[S.role].includes(k)).map(([k,v])=>`<a href="#${k}" class="${k==S.pg?"on":""}">${v}</a>`).join("");document.getElementById("ttl").textContent=PG[S.pg];document.getElementById("hdr").innerHTML=rsel()+tag("Main outlet","ok")+tag(new Date().toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}));document.getElementById("view").innerHTML=V[S.pg]()}
addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(PG[h]){S.pg=h;go()}});
seed();{const h=location.hash.slice(1);if(PG[h])S.pg=h}go();
</script></body></html>
